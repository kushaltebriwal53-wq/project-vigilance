<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Project Vigilance - SSL Auditor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090e17;
      --card-bg: rgba(15, 23, 42, 0.7);
      --primary: #00f0ff;
      --primary-glow: rgba(0, 240, 255, 0.6);
      --secondary: #7000ff;
      --text: #94a3b8;
      --text-bright: #f8fafc;
      --border: rgba(51, 65, 85, 0.5);
      --danger: #ff0055;
      --warning: #ffb800;
      --success: #00ff88;
    }

    @keyframes pulse-glow {
      0% { box-shadow: 0 0 10px var(--primary-glow); }
      50% { box-shadow: 0 0 25px var(--primary-glow); }
      100% { box-shadow: 0 0 10px var(--primary-glow); }
    }
    
    @keyframes bg-gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(-45deg, #090e17, #0f172a, #050510, #130a2a);
      background-size: 400% 400%;
      animation: bg-gradient 15s ease infinite;
      color: var(--text);
      padding-bottom: 50px;
      min-height: 100vh;
    }

    nav {
      background: rgba(9, 14, 23, 0.85);
      border-bottom: 1px solid var(--border);
      padding: 18px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      backdrop-filter: blur(12px);
      z-index: 100;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-bright);
      text-decoration: none;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo span {
      color: var(--primary);
      text-shadow: 0 0 15px var(--primary-glow);
    }

    .nav-links { display: flex; gap: 25px; }

    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 8px;
      transition: all 0.3s ease;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 2px;
      background: var(--primary);
      transition: width 0.3s ease;
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .nav-links a:hover::after, .nav-links a.active::after { width: 80%; }

    .nav-links a:hover, .nav-links a.active {
      color: var(--primary);
      background: rgba(0, 240, 255, 0.1);
    }

    .container { max-width: 1100px; margin: 50px auto; padding: 0 20px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 40px;
      border-radius: 16px;
      backdrop-filter: blur(20px);
      margin-bottom: 40px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: transform 0.4s ease, border-color 0.4s ease;
    }
    
    .card:hover {
      border-color: rgba(0, 240, 255, 0.3);
      transform: translateY(-2px);
    }

    h2 { 
      color: var(--text-bright); 
      margin-top: 0; 
      font-size: 28px;
      letter-spacing: -0.5px;
    }

    input[type="text"], input[type="email"] {
      width: 100%;
      padding: 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      color: var(--text-bright);
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 16px;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus, input[type="email"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      background: rgba(15, 23, 42, 1);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .row input[type="email"] { margin-bottom: 0; flex-grow: 1; }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-bright);
      white-space: nowrap;
      user-select: none;
    }
    
    .checkbox-label input[type="checkbox"] {
      accent-color: var(--primary);
      width: 18px;
      height: 18px;
    }

    .btn {
      padding: 16px 32px;
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      color: #fff;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 5px 20px rgba(112, 0, 255, 0.4);
      font-size: 16px;
      width: 100%;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .btn:hover:not(:disabled) {
      box-shadow: 0 8px 25px rgba(0, 240, 255, 0.5);
      transform: translateY(-2px) scale(1.02);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
    }

    .btn:disabled { 
      opacity: 0.5; 
      cursor: not-allowed; 
      animation: pulse-glow 2s infinite;
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .status-msg {
      margin-top: 20px;
      font-weight: 600;
      color: var(--warning);
      text-align: center;
      font-size: 16px;
      letter-spacing: 0.5px;
    }

    .terminal {
      background-color: #050510;
      padding: 20px;
      font-family: 'Courier New', Courier, monospace;
      color: #00ff88;
      border-radius: 10px;
      border: 1px solid rgba(0, 255, 136, 0.3);
      white-space: pre-wrap;
      font-size: 15px;
      overflow-x: auto;
      max-height: 350px;
      overflow-y: auto;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      margin-bottom: 25px;
    }

    table { 
      width: 100%; 
      border-collapse: separate; 
      border-spacing: 0;
      margin-top: 25px; 
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    th, td {
      padding: 18px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: rgba(15, 23, 42, 0.9);
      color: var(--primary);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 1px;
      width: 30%;
    }

    tr:last-child td { border-bottom: none; }
    
    tr { transition: background-color 0.3s ease; }
    tr:hover td { background-color: rgba(0, 240, 255, 0.05); }

    .badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-block;
    }

    .badge.valid {
      background-color: rgba(0, 255, 136, 0.15);
      color: var(--success);
      border: 1px solid rgba(0, 255, 136, 0.3);
    }

    .badge.invalid {
      background-color: rgba(255, 0, 85, 0.15);
      color: var(--danger);
      border: 1px solid rgba(255, 0, 85, 0.3);
    }

    .badge.warning {
      background-color: rgba(255, 184, 0, 0.15);
      color: var(--warning);
      border: 1px solid rgba(255, 184, 0, 0.3);
    }
  </style>
</head>

<body>

  <nav>
    <a href="/" class="logo">🛡️ Project <span>Vigilance</span></a>
    <div class="nav-links">
      <a href="/">Dashboard</a>
      <a href="/host-scan">Target Scanner</a>
      <a href="/software-check">CVE Auditor</a>
      <a href="/ssl-check" class="active">SSL Checker</a>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h2>🔒 Cryptography Auditor</h2>
      <p style="margin-bottom: 25px;">Enter a secure web domain to perform a deep teardown of its active TLS/SSL
        branches, identifying spoofing, expirations, or missing trust anchors.</p>
      <form id="sslForm">
        <input type="text" id="sslHost" placeholder="Target Domain URL (e.g. google.com)" required />
        <div class="row">
          <input type="email" id="userEmail" placeholder="Destination Email (Optional for alerts)" />
          <label class="checkbox-label"><input type="checkbox" id="sendMail"> Send Audit Trajectory</label>
        </div>
        <button type="submit" class="btn" id="btnCheck">Initiate Cryptographic Inspection</button>
      </form>
      <p id="sslResult" class="status-msg"></p>
    </div>

    <div id="logSection" class="card" style="display:none;">
      <h2 style="color: var(--primary); margin-bottom: 15px;">System Execution Trace</h2>
      <div id="terminalBody" class="terminal"></div>

      <h2 style="margin-top: 30px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">SSL Metrics Analysed
      </h2>
      <table id="certTable" style="display:none;">
        <tbody id="certTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    document.getElementById('sslForm').addEventListener('submit', async e => {
      e.preventDefault();
      const host = document.getElementById('sslHost').value.trim();
      const email = document.getElementById('userEmail').value.trim();
      const sendMail = document.getElementById('sendMail').checked;
      const btn = document.getElementById('btnCheck');
      const status = document.getElementById('sslResult');
      const tbody = document.getElementById('certTableBody');
      const tbl = document.getElementById('certTable');

      btn.disabled = true;
      status.innerText = "Deploying SSL handshakes and analyzing cryptographic architecture...";
      status.style.color = "var(--text)";
      document.getElementById('logSection').style.display = 'none';

      try {
        let reqBody = 'host=' + encodeURIComponent(host);
        if (sendMail && email) { reqBody += '&userEmail=' + encodeURIComponent(email); }

        const res = await fetch('/ssl-check/run', {
          method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: reqBody
        });
        const text = await res.text();

        let jsonLine = "";
        let logLines = [];

        // Split on actual newline (not escaped \\n)
        text.split('\n').forEach(line => {
          const trimmed = line.trim();
          if (trimmed.startsWith('{') && trimmed.includes('"status"')) {
            jsonLine = trimmed;
          } else if (trimmed.length > 0) {
            logLines.push(trimmed);
          }
        });

        document.getElementById('terminalBody').innerText = logLines.join('\n');
        document.getElementById('logSection').style.display = 'block';

        if (jsonLine) {
          const data = JSON.parse(jsonLine);
          const details = data.details || data.cert_details || {};
          const stat = (data.status || 'UNKNOWN').toUpperCase();

          let badgeCls = 'valid';
          if (stat === 'ERROR') badgeCls = 'invalid';
          else if (stat === 'ISSUES_FOUND') {
            const issues = (data.issues || []).join(' ').toUpperCase();
            if (issues.includes('EXPIRED') || issues.includes('MISMATCH')) badgeCls = 'invalid';
            else badgeCls = 'warning';
          }

          const daysOk = (details.days_remaining != null && details.days_remaining > 30);
          const hostnameOk = (details.hostname_mismatch === false);
          const tlsVer = details.tls_version || 'Unknown';
          const isVulnerableTls = ['TLSv1', 'TLSv1.1', 'SSLv3', 'SSLv2'].includes(tlsVer);

          const tlsRowStyle = isVulnerableTls
            ? 'background-color: rgba(255,0,85,0.15); border-left: 4px solid var(--danger);'
            : '';
          const tlsTextStyle = isVulnerableTls
            ? 'font-weight:bold; color:var(--danger); font-size:15px;'
            : 'font-weight:bold; color:var(--success);';
          const tlsLabel = isVulnerableTls
            ? `${tlsVer} ⚠️ DEPRECATED — CRITICAL RISK`
            : `${tlsVer} ✅ SECURE`;

          tbl.style.display = 'table';
          tbody.innerHTML = `
            <tr><th>Overall Status</th><td><span class="badge ${badgeCls}">${stat}</span></td></tr>
            <tr style="${tlsRowStyle}"><th style="color:${isVulnerableTls ? 'var(--danger)' : 'var(--primary)'};">Negotiated Protocol</th><td style="${tlsTextStyle}">${tlsLabel}</td></tr>
            <tr><th>Issues Found</th><td style="color:${badgeCls === 'invalid' ? 'var(--danger)' : 'var(--success)'};">${data.issues ? data.issues.join(', ') : 'None — certificate is clean'}</td></tr>
            <tr><th>Hostname Verified</th><td style="color:#fff; font-weight:500;">${hostnameOk ? '✅ Yes (SAN Verified)' : '❌ No — Mismatch detected'}</td></tr>
            <tr><th>Days Until Expiry</th><td style="font-weight:bold; color:${daysOk ? 'var(--success)' : 'var(--danger)'};">${details.days_remaining != null ? details.days_remaining + ' days' : 'N/A'}</td></tr>
            <tr><th>Expires On</th><td style="color:#a5b4fc;">${details.expiration_date || 'N/A'}</td></tr>
            <tr><th>Issuer</th><td style="color:#a5b4fc;">${details.issuer || 'N/A'}</td></tr>
            <tr><th>Subject</th><td style="color:#a5b4fc;">${details.subject || 'N/A'}</td></tr>
            <tr><th>Self-Signed</th><td style="color:${details.self_signed ? 'var(--danger)' : 'var(--success)'};">${details.self_signed ? '⚠️ Yes — Untrusted' : '✅ No'}</td></tr>
            <tr><th>Fully Trusted by CA</th><td style="color:${details.trusted ? 'var(--success)' : 'var(--warning)'};">${details.trusted ? '✅ Yes' : '⚠️ Not fully trusted'}</td></tr>
          `;
          status.innerText = stat === 'VALID' ? '✅ Certificate is valid and trusted.' : '⚠️ Issues detected — review findings below.';
          status.style.color = stat === 'VALID' ? 'var(--success)' : 'var(--warning)';

        } else {
          tbl.style.display = 'none';
          status.innerText = '❌ Could not parse SSL scanner output. Ensure the domain is reachable over HTTPS.';
          status.style.color = 'var(--danger)';
        }
      } catch (e) {
        status.innerText = "Fatal Error: " + e.message;
        status.style.color = "var(--danger)";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
